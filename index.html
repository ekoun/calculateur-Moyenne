
  <!DOCTYPE html>
  <html lang="fr" translate="no">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="google" content="notranslate" />
      <meta name="theme-color" content="#9B2C9B" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-title" content="CalcREA" />
      <meta name="description" content="Calculez vos moyennes ECUE, UE et semestre, même hors ligne." />
      <title>Calculateur de Moyenne</title>
      <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
      <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
      <style>
        html, body {
          margin: 0;
          min-height: 100%;
          background: #f8f9fa;
        }

        body {
          min-height: 100vh;
          font-family: Inter, system-ui, sans-serif;
        }

        #root {
          min-height: 100vh;
          opacity: 0;
          transition: opacity 0.2s ease;
        }

        body.ready #root {
          opacity: 1;
        }

        #preload-splash {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 1rem;
          background: #f8f9fa;
          transition: opacity 0.25s ease;
          z-index: 9999;
        }

        body.ready #preload-splash {
          opacity: 0;
          pointer-events: none;
        }

        #preload-splash img {
          width: 88px;
          height: 88px;
          display: block;
          border-radius: 24px;
          box-shadow: 0 18px 40px rgba(0, 0, 0, 0.1);
        }

        #preload-splash .brand {
          font-size: 1.1rem;
          font-weight: 700;
          letter-spacing: 0.02em;
          color: #9B2C9B;
        }

        #preload-splash .subtitle {
          font-size: 0.78rem;
          color: rgba(15, 23, 42, 0.7);
        }
      </style>
    </head>

    <body translate="no">
      <div id="preload-splash" aria-hidden="true">
        <img src="%BASE_URL%icons/icon-192.svg" alt="" />
        <div class="brand">CM - REATD</div>
        <div class="subtitle">Calculateur de Moyennes</div>
      </div>
      <div id="root" class="notranslate" translate="no"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
